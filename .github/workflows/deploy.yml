name: Legacy bot VPS read-only preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect legacy host without changing it
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 15s
          command_timeout: 30s
          script: |
            set -eu
            printf 'SSH connection established\n'
            docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
            if [ -d /opt/buryat-fillword-game-bot ]; then
              cd /opt/buryat-fillword-game-bot
              docker compose ps --format '{{.Service}} {{.State}} {{.Health}}'
            fi
